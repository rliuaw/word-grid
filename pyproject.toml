[project]
name = "word-grid"
version = "0.1.0"
description = "Web tools and training for NxN word grid construction and analysis"
readme = "ARCHITECTURE.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "spacy>=3.7.0",
    "nltk>=3.9.0",
    "pydantic>=2.0.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=3.1.0",
    "accelerate>=1.0.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
]

[project.optional-dependencies]
training = [
    "trl>=0.14.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "unsloth>=2024.12.0",
    "llama-cpp-python>=0.3.0",
    "wandb>=0.18.0",
    "jupyter>=1.1.0",
    "ipywidgets>=8.0.0",
    "modal>=1.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/word_grid"]

[project.scripts]
word-grid-web = "word_grid.app.main:run"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
